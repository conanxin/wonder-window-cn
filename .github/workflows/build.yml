name: build

on:
  pull_request:
  push:
    branches:
      - main
      - feat/release-candidate-preview-gate

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build production and verify candidate exclusion
        run: npm run build
      - name: Prove Vercel production cannot be overridden by preview flag
        env:
          VERCEL_ENV: production
          VITE_EDITORIAL_PREVIEW: 'true'
        run: npm run build
      - name: Build editorial preview and verify candidate inclusion
        env:
          VITE_EDITORIAL_PREVIEW: 'true'
        run: npm run build
