name: build

on:
  pull_request:
  push:
    branches:
      - main
      - feat/release-candidate-preview-gate

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Rehearse READY editorial release path
        run: npm run rehearse:ready
      - name: Test release rehearsal guards
        run: npm run test:release-rehearsal
      - name: Test release decision manifest
        run: npm run test:release-manifest
      - name: Test release workflow input safety
        run: npm run test:release-workflow-safety
      - name: Test approved manifest verification
        run: npm run test:approved-manifest
      - name: Build production and verify candidate exclusion
        run: npm run build
      - name: Prove Vercel production cannot be overridden by preview flag
        env:
          VERCEL_ENV: production
          VITE_EDITORIAL_PREVIEW: 'true'
        run: npm run build
      - name: Build editorial preview and verify candidate inclusion
        env:
          VITE_EDITORIAL_PREVIEW: 'true'
        run: npm run build
