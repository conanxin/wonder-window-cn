name: verify-production-surface

on:
  push:
    branches:
      - diag/production-surface-check
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify configured Production surface
        run: node scripts/check-production-surface.mjs
